<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mininova debug tool</title>
    <style>
        html {
            font-family: sans-serif;
        }

        body {
            background-color: grey;
        }

        .panel {
            background-color: #000066;
            color: white;
            padding: 1em;
            overflow-x: scroll;
        }

        button, label, input {
            font-size: small;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .sections {
            display: flex;
        }

        .section {
            padding: 0 0.5rem;
        }

        .section h2 {
            text-align: center;
            background-color: darkred;
            margin-top: 0;
        }

        .cols {
            display: flex;
        }

        .slider, .switch {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 0.25rem;
        }

        .slider input {
            margin-block-end: 20px;
            writing-mode: vertical-lr;
            direction: rtl;
            margin: auto;
        }

        label.ub-checkbutton, select, button {
            border: 1px solid lightgray;
            border-radius: 3px;
            padding: 5px;
            display: inline-block;
            margin-bottom: 3px;
        }

        input[type=checkbox].ub-checkbutton {
            display: none;
        }

        input[type=checkbox].ub-checkbutton:checked ~ label.ub-checkbutton {
            color: darkblue;
            background-color: white;
        }

        #warning { color: red; font-weight: bold; }

        .nope { text-decoration: line-through 2px; }
        .vata { display: block; height: 10px; }
        .footer { font-size: small; }
        .footer a { color: white; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>Mininova waveform debug tool</h1>
        <div class="sections">
            <div class="section">
                <h2>MIDI</h2>
                <div class="cols">
                    <div class="switch">
                        <select id="midi_devices">
                            <option disabled selected>no devices</option>
                        </select>
                        <button id="init">INIT PATCH</button>
                        <div id="warning">MIDI not connected!</div>
                    </div>
                </div>
            </div>
            <div class="section">
                <h2>Waveform</h2>
                <div class="cols">
                    <div class="switch">
                        <label for="wave">wave</label>
                        <select id="wave">
                            <option value="0">Sine</option>

                            <option value="34">Wavetable 1</option>
                            <option value="35">Wavetable 2</option>
                            <option value="36">Wavetable 3</option>
                            <option value="37">Wavetable 4</option>
                            <option value="38">Wavetable 5</option>
                            <option value="39">Wavetable 6</option>
                            <option value="40">Wavetable 7</option>
                            <option value="41">Wavetable 8</option>
                            <option value="42">Wavetable 9</option>
                            <option value="43">Wavetable 10</option>
                            <option value="44">Wavetable 11</option>
                            <option value="45">Wavetable 12</option>
                            <option value="46">Wavetable 13</option>
                            <option value="47">Wavetable 14</option>
                            <option value="48">Wavetable 15</option>
                            <option value="49">Wavetable 16</option>
                            <option value="50">Wavetable 17</option>
                            <option value="51">Wavetable 18</option>
                            <option value="52">Wavetable 19</option>
                            <option value="53">Wavetable 20</option>
                            <option value="54">Wavetable 21</option>
                            <option value="55">Wavetable 22</option>
                            <option value="56">Wavetable 23</option>
                            <option value="57">Wavetable 24</option>
                            <option value="58">Wavetable 25</option>
                            <option value="59">Wavetable 26</option>
                            <option value="60">Wavetable 27</option>
                            <option value="61">Wavetable 28</option>
                            <option value="62">Wavetable 29</option>
                            <option value="63">Wavetable 30</option>
                            <option value="64">Wavetable 31</option>
                            <option value="65">Wavetable 32</option>
                            <option value="66">Wavetable 33</option>
                            <option value="67">Wavetable 34</option>
                            <option value="68">Wavetable 35</option>
                            <option value="69">Wavetable 36</option>

                        </select>

                        <label for="partial">partial</label>
                        <select id="partial">
                            <option value="7">P1</option>
                            <option value="21">P2</option>
                            <option value="35">P3</option>
                            <option value="49">P4</option>
                            <option value="63">P5</option>
                            <option value="77">P6</option>
                            <option value="91">P7</option>
                            <option value="105">P8</option>
                            <option value="123">P9</option>
                        </select>

                        <div class="vata"></div>
                        <button id="pong">play all partials</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // WARNING
        //
        // Following code is absolute mess. It will bite you when reading it.
        //
        // It works though.
        //
        let dummyOut = {
            send: function () {}
        };

        // todo - debug out

        let globalMidiAccess = false;
        let midiOut = dummyOut;

        function initControls() {
            document.getElementById('midi_devices').onchange = function () {
                console.log('selected out = ' + document.getElementById('midi_devices').value);
                console.log(globalMidiAccess.outputs);
                // console.log(globalMidiAccess.outputs[document.getElementById('midi_devices').value]);
                midiOut = globalMidiAccess.outputs.get(document.getElementById('midi_devices').value);
                midiOut.open();
            };



            document.getElementById('init').onclick = function (ev) {
                initPatch();
                updateAll();
            }

            watchOut('wave', updateAll);
            watchOut('partial', updateAll);

            document.getElementById('pong').onclick = function () {
                pong();
            }
        }

        function watchOut(el, fun)
        {
            // console.log(el);
            let elem = document.getElementById(el)
            if (!elem) {
                console.log('cannot watch ' + el);
            }
            elem.onchange = function() { fun() };
        }

        function updateAll()
        {
            sendCc(19, document.getElementById('wave').value);
            sendCc(21, document.getElementById('partial').value);
        }

        function initPatch()
        {
            sendCc(3, 3); // Polyphone 2 voice mode (should be less glitchy)

            sendCc(19, 34); // OSC1 WT1
            sendCc(20, 0); // WtInt 0
            sendCc(51, 127); // OSC1 mix 100%

            // other off
            sendCc(52, 0);
            sendCc(53, 0);
            // ring mod off to be sure
            sendCc(54, 0);
            sendCc(55, 0);
        }


        function sendNrpn(msb, lsb, val, adj)
        {
            sendCc(99, msb);
            sendCc(98, lsb);
            sendCc(6, val);
            if (adj) {
                sendCc(38, adj);
            }
        }

        function sendCc(cc, val, ch) {
            let channel = ch || 0; // ch je od nuly
            // console.log('send CC='+cc+'='+val);
            // console.log([0xB0 | channel, cc, parseInt(val)]);
            midiOut.send([0xB0 | channel, cc, parseInt(val)]);
        }

        function sendNoteOn(nn, vel, ch) {
            let channel = ch || 0; // ch je od nuly
            vel = vel || 100;
            // console.log('send CC='+cc+'='+val);
            // console.log([0xB0 | channel, cc, parseInt(val)]);
            midiOut.send([0x90 | channel, nn, vel]);
        }

        function sendNoteOff(nn, ch) {
            let channel = ch || 0; // ch je od nuly
            // console.log('send CC='+cc+'='+val);
            // console.log([0xB0 | channel, cc, parseInt(val)]);
            midiOut.send([0x80 | channel, nn, 0]);
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms))
        }

        async function pong()
        {
            const toneLen = 200;
            const pauseBetween = 200;
            const pauseAfterCc = 200;

            const partials = [7, 21, 35, 49, 63, 77, 91, 105, 123];

            for (const part of partials) {
                sendCc(21, part); // partial X
                await sleep(pauseAfterCc);
                sendNoteOn(60, 100);
                await sleep(toneLen);
                sendNoteOff(60);
                await sleep(pauseBetween);
            }
        }


        function initMidi()
        {
            navigator.requestMIDIAccess().then(function (midiAccess){
                // hide MIDI disconnected warning
                document.getElementById('warning').style.display = 'none';

                //
                globalMidiAccess = midiAccess;

                // populate MIDI selector
                let devices = document.getElementById('midi_devices');
                midiAccess.outputs.forEach(function (output, id){
                    let opt = document.createElement('option');
                    opt.innerText = output.name;
                    opt.value = id;
                    devices.appendChild(opt);
                });

                // init rest of controls
                initControls()
            }, function (){
                // todo - user disallowed
            });
        }

        document.onreadystatechange = () => {
            if (document.readyState === "interactive") {
                initMidi();
            }
        };


    </script>
</body>
</html>
